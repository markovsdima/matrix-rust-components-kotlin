apply plugin: 'maven-publish'
apply plugin: 'signing'

group = PUBLISH_GROUP_ID

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId PUBLISH_GROUP_ID
                artifactId PUBLISH_ARTIFACT_ID
                version PUBLISH_VERSION

                if (project.plugins.findPlugin("com.android.library")) {
                    from components.release
                } else {
                    from components.java
                }

                pom {
                    name = PUBLISH_ARTIFACT_ID
                    description = PUBLISH_DESCRIPTION
                    url = 'https://github.com/markovsdima/matrix-rust-components-kotlin'
                    licenses {
                        license {
                            name = 'The Apache Software License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'markovsdima'
                            name = 'markovsdima'
                            email = 'markovsdima@users.noreply.github.com'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/markovsdima/matrix-rust-components-kotlin.git'
                        developerConnection = 'scm:git:ssh://git@github.com/markovsdima/matrix-rust-components-kotlin.git'
                        url = 'https://github.com/markovsdima/matrix-rust-components-kotlin'
                    }
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/markovsdima/matrix-rust-components-kotlin")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

nexusPublishing {
    useStaging.convention(project.provider {
        !PUBLISH_VERSION.endsWith("-SNAPSHOT")
    })
}

signing {
    useInMemoryPgpKeys(
            rootProject.ext["signing.keyId"],
            rootProject.ext["signing.key"],
            rootProject.ext["signing.password"],
    )
    sign publishing.publications
    required {
        !PUBLISH_VERSION.endsWith("-SNAPSHOT") &&
                !gradle.taskGraph.hasTask("${project.path}:publishToMavenLocal") &&
                !gradle.taskGraph.hasTask("${project.path}:publishReleasePublicationToMavenLocal") &&
                !gradle.taskGraph.hasTask("${project.path}:publishReleasePublicationToGitHubPackagesRepository")
    }
}
